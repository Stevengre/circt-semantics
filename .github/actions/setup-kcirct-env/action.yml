name: 'Set Up kcirct Environment'
description: '构建包含 K、CIRCT 和 HDL 工具的测试环境'
inputs:
  container-name:
    description: '测试容器名称'
    required: true
  tag-name:
    description: '本地 Docker 镜像标签'
    default: 'kcirct-ci:local'
  subdir:
    description: '相对于 GITHUB_WORKSPACE 的项目目录'
    default: '.'
  dockerfile:
    description: '相对于项目目录的 Dockerfile 路径'
    default: '.github/workflows/Dockerfile'
  poetry-version:
    description: '与 poetry.lock 格式兼容的 Poetry 版本'
    default: '2.4.1'
runs:
  using: composite
  steps:
    - name: 构建并启动 Docker
      shell: bash
      env:
        CONTAINER_NAME: ${{ inputs.container-name }}
        IMAGE_TAG: ${{ inputs.tag-name }}
        SOURCE_SUBDIR: ${{ inputs.subdir }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        POETRY_VERSION: ${{ inputs.poetry-version }}
      run: |
        set -euo pipefail
        source_dir=$(realpath "$GITHUB_WORKSPACE/$SOURCE_SUBDIR")
        dockerfile=$(realpath "$source_dir/$DOCKERFILE")
        k_version=$(tr -d '\r\n' < "$source_dir/deps/k_release")

        # Dockerfile 只安装工具；不把源码、宿主 .venv 或缓存发送到构建上下文。
        docker build "$(dirname "$dockerfile")" \
          --file "$dockerfile" \
          --tag "$IMAGE_TAG" \
          --build-arg "K_VERSION=$k_version" \
          --build-arg "POETRY_VERSION=$POETRY_VERSION" \
          --build-arg "USER_ID=$(id -u)" \
          --build-arg "GROUP_ID=$(id -g)"

        # 与 runner 使用相同 UID/GID，报告写回工作区后可直接上传。
        docker run --detach \
          --name "$CONTAINER_NAME" \
          --user github-user \
          --workdir /workspace \
          --mount "type=bind,source=$source_dir,target=/workspace" \
          "$IMAGE_TAG" sleep infinity
        docker exec "$CONTAINER_NAME" bash -c '
          set -euo pipefail
          python3 --version
          poetry --version
          kompile --version
          firtool --version
          arcilator --version
          verilator --version
          iverilog -V
        '
